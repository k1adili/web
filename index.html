<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K1 Adili — Projects</title>

<meta name="description"
      content="K1 Adili — Software, Python, Data Science, Android and Open Source Projects">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #07090d;
    --bg2: #0d1117;
    --card: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.09);
    --text: #f2f4f7;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #bc8cff;
    --green: #3fb950;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(88,166,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(188,140,255,.10),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    background: rgba(7,9,13,.72);
    border-bottom: 1px solid var(--border);
}

.nav {
    max-width: 1200px;
    margin: auto;

    padding: 18px 24px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span {
    color: var(--accent);
}

.github-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;

    transition: .2s;
}

.github-link:hover {
    color: white;
}


/* =========================
   HERO
========================= */

.hero {
    max-width: 1200px;
    margin: auto;

    padding: 100px 24px 70px;

    text-align: center;
}

.avatar {
    width: 96px;
    height: 96px;

    border-radius: 50%;

    border: 3px solid rgba(88,166,255,.5);

    margin-bottom: 24px;

    box-shadow:
        0 0 50px rgba(88,166,255,.18);
}

.hero h1 {
    font-size: clamp(42px, 7vw, 76px);
    line-height: 1;

    letter-spacing: -3px;

    margin-bottom: 20px;
}

.hero h1 span {
    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2)
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.hero p {
    max-width: 680px;
    margin: auto;

    color: var(--muted);

    font-size: 18px;
    line-height: 1.8;
}


/* =========================
   STATS
========================= */

.stats {
    max-width: 900px;
    margin: 30px auto 0;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 12px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 20px;

    backdrop-filter: blur(10px);
}

.stat strong {
    display: block;

    font-size: 28px;
    margin-bottom: 5px;
}

.stat span {
    color: var(--muted);
    font-size: 13px;
}


/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;
    margin: auto;

    padding: 20px 24px 100px;
}

.section-title {
    margin-bottom: 25px;
}

.section-title h2 {
    font-size: 32px;
    letter-spacing: -1px;
}

.section-title p {
    color: var(--muted);
    margin-top: 8px;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    gap: 12px;

    margin-bottom: 30px;

    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 230px;
}

input,
select {

    width: 100%;

    background: var(--bg2);

    border: 1px solid var(--border);

    color: var(--text);

    padding: 13px 16px;

    border-radius: 12px;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

input:focus,
select:focus {
    border-color: var(--accent);
}

select {
    width: 200px;
}


/* =========================
   PROJECT GRID
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));

    gap: 18px;
}


/* =========================
   CARD
========================= */

.card {

    position: relative;

    display: flex;
    flex-direction: column;

    min-height: 270px;

    padding: 23px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border: 1px solid var(--border);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    overflow: hidden;
}

.card::before {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    background:
        radial-gradient(
            circle,
            rgba(88,166,255,.12),
            transparent 70%
        );

    top: -90px;
    right: -90px;
}

.card:hover {

    transform: translateY(-6px);

    border-color:
        rgba(88,166,255,.35);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.card-top {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    margin-bottom: 18px;
}

.repo-icon {

    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
        rgba(88,166,255,.10);

    color: var(--accent);

    font-size: 20px;
}

.repo-name {

    font-size: 19px;

    font-weight: 700;

    word-break: break-word;
}

.repo-description {

    color: var(--muted);

    line-height: 1.7;

    font-size: 14px;

    margin-bottom: 20px;

    flex: 1;
}

.meta {

    display: flex;

    gap: 15px;

    flex-wrap: wrap;

    color: var(--muted);

    font-size: 12px;

    margin-bottom: 18px;
}

.language {

    display: flex;

    align-items: center;

    gap: 6px;
}

.dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: var(--accent);
}

.card-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.view {

    color: white;

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;

    padding: 9px 14px;

    border-radius: 9px;

    background: rgba(88,166,255,.12);

    transition: .2s;
}

.view:hover {

    background:
        rgba(88,166,255,.25);
}

.updated {

    color: #6e7681;

    font-size: 11px;
}


/* =========================
   EMPTY / LOADING
========================= */

.message {

    text-align: center;

    padding: 70px 20px;

    color: var(--muted);
}


/* =========================
   FOOTER
========================= */

footer {

    border-top:
        1px solid var(--border);

    padding: 35px 20px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

footer a {

    color: var(--accent);

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {

    .hero {
        padding-top: 70px;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    select {
        width: 100%;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>


<body>


<header>

    <nav class="nav">

        <div class="logo">
            K1<span>.</span>
        </div>

        <a
            class="github-link"
            href="https://github.com/k1adili"
            target="_blank"
        >
            GitHub ↗
        </a>

    </nav>

</header>



<section class="hero">

    <img
        class="avatar"
        src="https://github.com/k1adili.png"
        alt="K1 Adili"
    >

    <h1>
        K1 <span>Projects</span>
    </h1>

    <p>
        A collection of software, Python, Android,
        data science and open-source projects.
    </p>


    <div class="stats">

        <div class="stat">
            <strong id="repoCount">—</strong>
            <span>Repositories</span>
        </div>

        <div class="stat">
            <strong id="starsCount">—</strong>
            <span>Stars</span>
        </div>

        <div class="stat">
            <strong id="forksCount">—</strong>
            <span>Forks</span>
        </div>

        <div class="stat">
            <strong id="languageCount">—</strong>
            <span>Languages</span>
        </div>

    </div>

</section>



<main>

    <div class="section-title">

        <h2>Projects</h2>

        <p>
            Explore the projects and experiments.
        </p>

    </div>


    <div class="controls">

        <div class="search">

            <input
                id="search"
                type="search"
                placeholder="Search projects..."
            >

        </div>


        <select id="languageFilter">

            <option value="all">
                All languages
            </option>

        </select>


        <select id="sort">

            <option value="updated">
                Recently updated
            </option>

            <option value="stars">
                Most stars
            </option>

            <option value="name">
                Name
            </option>

        </select>

    </div>


    <div
        id="projects"
        class="grid"
    >

        <div class="message">
            Loading projects...
        </div>

    </div>

</main>



<footer>

    © 2026 K1 Adili ·

    <a
        href="https://github.com/k1adili"
        target="_blank"
    >
        github.com/k1adili
    </a>

</footer>



<script>

const username = "k1adili";

let repositories = [];

const projects =
    document.getElementById("projects");

const search =
    document.getElementById("search");

const languageFilter =
    document.getElementById("languageFilter");

const sort =
    document.getElementById("sort");



async function loadRepositories() {

    try {

        const response =
            await fetch(
                `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`
            );

        if (!response.ok)
            throw new Error("GitHub API error");

        repositories =
            await response.json();

        repositories =
            repositories.filter(
                repo => !repo.fork
            );

        updateStats();

        createLanguageFilter();

        render();

    }

    catch(error) {

        projects.innerHTML = `
            <div class="message">
                Unable to load GitHub projects.
            </div>
        `;

        console.error(error);
    }
}



function updateStats() {

    const stars =
        repositories.reduce(
            (sum, repo) =>
                sum + repo.stargazers_count,
            0
        );

    const forks =
        repositories.reduce(
            (sum, repo) =>
                sum + repo.forks_count,
            0
        );

    const languages =
        new Set(
            repositories
                .map(repo => repo.language)
                .filter(Boolean)
        );

    document.getElementById(
        "repoCount"
    ).textContent =
        repositories.length;

    document.getElementById(
        "starsCount"
    ).textContent =
        stars;

    document.getElementById(
        "forksCount"
    ).textContent =
        forks;

    document.getElementById(
        "languageCount"
    ).textContent =
        languages.size;
}



function createLanguageFilter() {

    const languages =
        [...new Set(
            repositories
                .map(repo => repo.language)
                .filter(Boolean)
        )].sort();

    languages.forEach(language => {

        const option =
            document.createElement("option");

        option.value = language;

        option.textContent = language;

        languageFilter.appendChild(option);

    });

}



function render() {

    let data =
        [...repositories];

    const query =
        search.value
            .toLowerCase()
            .trim();

    const selectedLanguage =
        languageFilter.value;


    if (query) {

        data =
            data.filter(repo =>

                repo.name
                    .toLowerCase()
                    .includes(query)

                ||

                (repo.description || "")
                    .toLowerCase()
                    .includes(query)

            );

    }


    if (selectedLanguage !== "all") {

        data =
            data.filter(
                repo =>
                    repo.language ===
                    selectedLanguage
            );

    }


    if (sort.value === "stars") {

        data.sort(
            (a,b) =>
                b.stargazers_count -
                a.stargazers_count
        );

    }


    else if (sort.value === "name") {

        data.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );

    }


    else {

        data.sort(
            (a,b) =>
                new Date(b.updated_at) -
                new Date(a.updated_at)
        );

    }


    if (!data.length) {

        projects.innerHTML = `
            <div class="message">
                No projects found.
            </div>
        `;

        return;
    }


    projects.innerHTML =
        data.map(createCard).join("");

}



function createCard(repo) {

    const description =
        repo.description ||
        "No description available.";

    const updated =
        new Date(
            repo.updated_at
        ).toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );


    return `

        <article class="card">

            <div class="card-top">

                <div>

                    <div class="repo-name">
                        ${escapeHtml(repo.name)}
                    </div>

                </div>

                <div class="repo-icon">
                    ◈
                </div>

            </div>


            <div class="repo-description">

                ${escapeHtml(description)}

            </div>


            <div class="meta">

                ${
                    repo.language
                    ?
                    `
                    <span class="language">

                        <span class="dot"></span>

                        ${escapeHtml(repo.language)}

                    </span>
                    `
                    : ""
                }


                <span>
                    ★ ${repo.stargazers_count}
                </span>


                <span>
                    ⑂ ${repo.forks_count}
                </span>

            </div>


            <div class="card-footer">

                <span class="updated">
                    Updated ${updated}
                </span>

                <a
                    class="view"
                    href="${repo.html_url}"
                    target="_blank"
                    rel="noopener"
                >
                    View project →
                </a>

            </div>

        </article>

    `;

}



function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



search.addEventListener(
    "input",
    render
);

languageFilter.addEventListener(
    "change",
    render
);

sort.addEventListener(
    "change",
    render
);


loadRepositories();

</script>

</body>
</html>
